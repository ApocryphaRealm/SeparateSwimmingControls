; Separate Swimming Controls. Everything here is also on the mod's page in the Apocrypha Menu Framework, where it applies at once.

[Debug]
; 2 = info. Lower numbers write more to My Games\Skyrim Special Edition\SKSE\SeparateSwimmingControls.log.
uLogLevel=2

[General]
; 0 = nothing in this mod does anything.
bEnabled=1

; 1 = Ascend and Descend work, and Sneak does not sneak in water (you are never left sneaking when you climb out). Jump keeps
; its own key and is what leaves the water.
; 0 = none of that: Sneak and Jump do in water what the game and your other mods make them do.
bSwimVertical=1

; How fast Ascend and Descend move you, in game units a second (10 to 1000; about 70 is one metre a second). Added to whatever
; your gear's weight and other swimming mods are doing.
fSwimVerticalSpeed=150

[Keys]
; A keyboard key is a DirectInput scan code; a controller button is one of 0x0001 D-pad up, 0x0002 D-pad down, 0x0004 D-pad left,
; 0x0008 D-pad right, 0x0010 Start, 0x0020 Back, 0x0040 L3, 0x0080 R3, 0x0100 LB, 0x0200 RB, 0x0009 LT, 0x000A RT, 0x1000 A,
; 0x2000 B, 0x4000 X, 0x8000 Y. 0 = no key. While you are in water a key here does nothing else. On land Ascend and Descend do
; nothing and their keys keep their game use.
; 0x14 = T; right trigger
iAscendKey=0x14
iAscendPad=0x000A
; 0x1D = Left Ctrl; left trigger
iDescendKey=0x1D
iDescendPad=0x0009
; 0x15 = Y; D-pad left. Away from water the key keeps its game use.
iDiveKey=0x15
iDivePad=0x0004

[Dive]
; 1 = the Dive key: with deep water just ahead, a leap into it and a push under; at the surface, the push under.
bDive=1

; 1 = when Simple Diving System is installed, its pose plays in the air. Without that mod the leap plays the game's own fall.
bDiveAnimation=1

; The leap: forward speed (0 to 1000) and lift (0 to 800), game units a second.
fDiveForward=350
fDiveUp=220

; The push under: speed (10 to 1000) and how long it lasts in seconds (0.1 to 5).
fDiveSinkSpeed=300
fDiveSinkSeconds=0.8
